<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Carlos Nascimento">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <title>lg</title>
</head>

<body>
    <main>

        <div class="container">

            <aside class="aside">
                <div class="aside-content">
                    <div class="logo">
                        <img width="50" height="50" src="https://img.icons8.com/ios/50/git.png" alt="git" />
                        <div>
                            <div class="top">Banco de</div>
                            <div class="bottom">Informações</div>
                        </div>
                    </div>

                    <p> acesso institucional </p>

                    <div class="temas">
                        <h2>criar.</h2>
                        <h2>manter.</h2>
                        <h2>inovar.</h2>
                    </div>

                    <p>Criando soluções</p>
                </div>
            </aside>


            <div class="form-container">
                <div class="form-content">
                    <form class="form">
                        <div>
                            <label for="email">E-mail</label>
                            <input type="text" placeholder="E-mail" id="email" class="field">
                        </div>
                        <div>
                            <label for="password">Senha</label>
                            <input type="password" placeholder="Senha" id="Senha" class="field">

                        <button class="btn">Acessar</button>

        </div>
