<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="author" content="Carlos Nascimento">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/login.css">
  <title>lg</title>
</head>

<body>
  <main>

    <div class="container">
      <aside class="aside">
        <div class="aside-content">
          <div class="logo">
            <i class="fa-regular fa-circle-question"></i>
            <div>
              <div class="top">Banco de</div>
              <div class="bottom">Informações</div>
            </div>
          </div>

          <p class="badge"> acesso institucional </p>

          <div class="temas">
            <h2>criar.</h2>
            <h2>manter.</h2>
            <h2>inovar.</h2>
          </div>

          <p>Criando soluções</p>
        </div>
      </aside>


      <div class="form-container">
        <div class="form-content">
          <h1>Acesso aos sistemas bancários</h1>
          <form class="form">
            <div>
              <label for="email">E-mail</label>
              <input type="text" placeholder="E-mail" id="email" class="field">
            </div>
            <div>
              <label for="password">Senha</label>
              <input type="password" placeholder="Senha" id="Senha" class="field">
            </div>
            <button class="btn">Acessar</button>
          </form>
        </div>
      </div>

    </div>

  </main>
</body>

</html>
